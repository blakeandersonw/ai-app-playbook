# Copy to .github/dependabot.yml (playbook/14-shipping.md).
# Dependabot opens update PRs; .github/workflows/dependabot-check.yml checks them, asks Claude for a
# verdict and merges the safe ones. iOS packages are not covered: Dependabot can't read Xcode
# projects, and SDK updates ship with an App Store release anyway.
version: 2
updates:
  # The bun workspace at the root (apps/api, apps/web, …). Use npm with the folder for an npm app.
  - package-ecosystem: bun
    directory: /
    # Wait before taking a new release, so a hijacked version is usually caught first.
    # Security updates ignore this and arrive right away.
    cooldown:
      default-days: 7
      semver-major-days: 30
    schedule:
      interval: daily
      time: "06:00"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
      semver-major-days: 30
    schedule:
      interval: weekly
